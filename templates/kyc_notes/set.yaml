entries:
- id: kyc_general
  weight: '0.5'
  text: 'Musteri gorusmesi notu. Basvuru sahibi {entity:PERSON}, kimlik numarasi {id:TCKN}. Meslek beyani:
    {field:kyc_note.category} alaninda {lex:occupations_bank_tr} olarak calisiyor. Gelir kaynagi (maas|serbest meslek geliri|kira geliri)
    olarak beyan edildi. Adres teyidi {entity:ADDRESS} uzerinden yapildi, iletisim {id:PHONE} ve {id:EMAIL}.
    Hesap {id:IBAN} olarak, {lex:products_fictional} urunu kapsaminda acildi. [?0.6: Isyeri olarak {entity:ORG} beyan edildi; kurumsal vergi numarasi
    {id:VKN} olarak kaydedildi.] Belgeler (tam|eksiksiz) olarak alindi ve dosyaya islendi.'
