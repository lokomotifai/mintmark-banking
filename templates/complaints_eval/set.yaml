entries:
- id: eval_health_religion
  weight: '1'
  text: 'Sayin yetkili, {entity:PERSON} adima kayitli hesabimla ilgili bir sikayetim var. Kimlik numaram
    {id:TCKN}, hesabim {id:IBAN}, adresim {entity:ADDRESS}. Iletisim: {id:PHONE} ve {id:EMAIL}. Dogum
    tarihim {entity:DOB}. Islem {entity:ORG} firmasi ile yapilmis, kurumsal vergi numarasi {id:VKN} olarak
    gecmektedir. Kartima ait {id:PAN} bilgisi de dosyada yer almaktadir. [?special: Basvuru sirasinda
    {entity:HEALTH} durumumu belirtmistim.] [?special: Ayrica {entity:RELIGION} kaydinin dosyama islenmesini
    talep etmistim.] Konunun incelenmesini rica ederim.'
