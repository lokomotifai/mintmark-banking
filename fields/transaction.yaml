schema_version: 1
type_name: transaction
id_prefix: TXN
order: 4
fields:
  - {name: txn_id, type: str, generator: seq_id, pii_label: none}
  - name: account_id
    type: ref
    generator: seq_id
    ref: {parent: account, counts: [8, 14, 20, 28], weights: ["0.30", "0.35", "0.25", "0.10"]}
    pii_label: none
  - {name: ts, type: datetime, generator: datetime_window, pii_label: none}
  - name: channel
    type: enum
    generator: enum_weighted
    params:
      values: [mobil, internet, pos, atm, sube]
      weights: ["0.52", "0.18", "0.15", "0.10", "0.05"]
    pii_label: none
  - name: type
    type: enum
    generator: enum_weighted
    params:
      values: [kart, eft, havale, fast, fatura]
      weights: ["0.40", "0.20", "0.15", "0.15", "0.10"]
    pii_label: none
  - {name: amount_kurus, type: int, generator: "int_lognormal_table:txn_amounts", pii_label: none}
  - {name: counterparty_name, type: str, generator: "lexicon:counterparties_tr", pii_label: ORG}
  - {name: counterparty_iban, type: str, generator: "identifier:IBAN", nullable: true, null_rate: "0.35", pii_label: IBAN}
  - name: anomaly_kind
    type: enum
    generator: enum_weighted
    params:
      values: [none, burst, velocity, round_amount_series, dormant_reactivation]
      weights: ["0.94", "0.02", "0.015", "0.015", "0.01"]
    pii_label: none
  - name: is_anomaly
    type: str
    generator: "derived:flag_unless"
    params: {source: anomaly_kind, value: none}
    pii_label: none
  - {name: description, type: doc, generator: "grammar:txn_descriptions", pii_label: none}
