schema_version: 1
type_name: customer
id_prefix: CUST
order: 1
fields:
  - {name: customer_id, type: str, generator: seq_id, pii_label: none}
  - {name: first_name, type: str, generator: "lexicon:given_names_tr", pii_label: PERSON}
  - {name: last_name, type: str, generator: "lexicon:surnames_tr", pii_label: PERSON}
  - {name: national_id, type: str, generator: "identifier:TCKN", pii_label: TCKN}
  # Drawn from the span that gives a person this age at the start of the
  # recipe window. A banking customer is an adult; the upper bound is a plausible span rather than a rule.
  - {name: birth_date, type: date, generator: datetime_window,
     params: {age_years: [18, 90]}, pii_label: DOB}
  - {name: email, type: str, generator: "derived:email_from_name", pii_label: EMAIL}
  - {name: phone, type: str, generator: "identifier:PHONE", pii_label: PHONE}
  - {name: il, type: str, generator: "lexicon:provinces_tr", pii_label: ADDRESS}
  - {name: mahalle, type: str, generator: "lexicon:mahalleler_tr", pii_label: ADDRESS}
  - {name: street, type: str, generator: "lexicon:sokaklar_tr", pii_label: ADDRESS}
  - {name: building_no, type: int, generator: int_uniform, params: {low: 1, high: 180}, pii_label: ADDRESS}
  - name: segment
    type: enum
    generator: enum_weighted
    params: {values: [mass, affluent, private], weights: ["0.80", "0.15", "0.05"]}
    pii_label: none
  - name: kyc_status
    type: enum
    generator: enum_weighted
    params: {values: [verified, pending, expired], weights: ["0.93", "0.05", "0.02"]}
    pii_label: none
  - {name: join_date, type: date, generator: datetime_window, pii_label: none}
